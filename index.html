<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14201f">
<title>成就計算</title>
<style>
  :root {
    --bg: #eef0ea;
    --bg-glow: rgba(215, 160, 80, .22);
    --card: rgba(255, 255, 255, .78);
    --card-line: rgba(40, 60, 55, .14);
    --ink: #1f2b29;
    --sub: #5c6b67;
    --accent: #b9772a;
    --accent-2: #d99a45;
    --accent-ink: #ffffff;
    --track: rgba(40, 60, 55, .12);
    --tile: rgba(185, 119, 42, .09);
    --ok: #2f7d4f;
    --shadow: 0 8px 28px rgba(30, 50, 45, .10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101a19;
      --bg-glow: rgba(224, 160, 80, .13);
      --card: rgba(30, 44, 42, .72);
      --card-line: rgba(255, 255, 255, .09);
      --ink: #eef1ea;
      --sub: #94a5a0;
      --accent: #e3a04d;
      --accent-2: #f0bf72;
      --accent-ink: #1a1408;
      --track: rgba(255, 255, 255, .10);
      --tile: rgba(227, 160, 77, .10);
      --ok: #7fd9a4;
      --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    line-height: 1.5;
    padding: 28px 16px calc(32px + env(safe-area-inset-bottom));
    background:
      radial-gradient(120% 60% at 50% -10%, var(--bg-glow), transparent 70%),
      var(--bg);
    background-attachment: fixed;
  }
  main { max-width: 460px; margin: 0 auto; }

  header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .emblem {
    width: 44px; height: 44px; flex: none;
    border-radius: 13px;
    display: grid; place-items: center;
    background: linear-gradient(145deg, var(--accent-2), var(--accent));
    box-shadow: 0 4px 14px rgba(185, 119, 42, .35);
  }
  .emblem svg { width: 24px; height: 24px; stroke: var(--accent-ink); }
  h1 { font-size: 19px; margin: 0; letter-spacing: .04em; }
  .lead { margin: 2px 0 0; font-size: 12.5px; color: var(--sub); }

  /* 曜日タブ */
  .tabs { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 14px; }
  .tab {
    padding: 10px 0 8px;
    font-size: 15px;
    font-weight: 700;
    border-radius: 12px;
    border: 1px solid var(--card-line);
    background: var(--card);
    color: var(--sub);
    cursor: pointer;
    box-shadow: none;
    width: auto;
  }
  .tab small { display: block; white-space: nowrap; font-size: 9.5px; font-weight: 400; margin-top: 1px; opacity: .85; }
  .tab.soon { opacity: .5; }
  .tab.active {
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    color: var(--accent-ink);
    border-color: transparent;
    box-shadow: 0 4px 14px rgba(185, 119, 42, .3);
    opacity: 1;
  }
  .day-title { display: flex; align-items: baseline; justify-content: space-between; margin: 0 2px 10px; }
  .day-title b { font-size: 17px; }
  .day-title span { font-size: 12.5px; color: var(--sub); }

  .card {
    background: var(--card);
    border: 1px solid var(--card-line);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }
  .fields { display: grid; gap: 14px; }
  label { display: block; font-size: 12.5px; color: var(--sub); margin-bottom: 7px; letter-spacing: .04em; }
  label em { font-style: normal; color: var(--accent); margin-left: 6px; font-variant-numeric: tabular-nums; }
  label .note { display: block; margin-top: 3px; font-size: 11.5px; color: var(--accent); letter-spacing: .02em; }
  .group {
    font-size: 12px; font-weight: 700; letter-spacing: .1em; color: var(--accent);
    padding-bottom: 6px; margin-top: 4px; border-bottom: 1px solid var(--card-line);
  }
  .group:first-child { margin-top: 0; }
  .rows.sub { margin-top: 16px; }
  .rowset .calc { margin-top: 3px; font-size: 12px; color: var(--sub); line-height: 1.5; }
  .field { position: relative; }
  input[type="number"] {
    width: 100%;
    font-size: 26px;
    font-weight: 700;
    padding: 10px 54px 10px 16px;
    border: 1px solid var(--card-line);
    border-radius: 14px;
    background: var(--track);
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    -moz-appearance: textfield;
    transition: border-color .2s, box-shadow .2s;
  }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(227, 160, 77, .18);
  }
  .unit { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: var(--sub); font-size: 15px; pointer-events: none; }

  .result { animation: rise .35s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .meter-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .meter-head .k { font-size: 12.5px; color: var(--sub); letter-spacing: .06em; }
  .meter-head .pct { font-size: 22px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .track { height: 10px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .fill {
    height: 100%; width: 0;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width .5s cubic-bezier(.2, .8, .2, 1);
  }
  .meter-foot { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12.5px; color: var(--sub); font-variant-numeric: tabular-nums; }

  .rows { display: grid; gap: 10px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--card-line); }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .row .k { color: var(--sub); font-size: 14px; }
  .row .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .remain { margin-top: 18px; background: var(--tile); border-radius: 14px; padding: 14px 12px 12px; text-align: center; }
  .remain span { font-size: 12.5px; color: var(--sub); letter-spacing: .06em; }
  .remain b { display: block; font-size: 30px; line-height: 1.3; color: var(--accent); font-variant-numeric: tabular-nums; }

  .boost-title { font-size: 12.5px; color: var(--sub); letter-spacing: .06em; margin: 18px 0 8px; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tile { background: var(--tile); border-radius: 14px; padding: 12px 6px 10px; text-align: center; }
  .tile b { display: block; font-size: 26px; line-height: 1.2; color: var(--accent); font-variant-numeric: tabular-nums; }
  .tile span { font-size: 12px; color: var(--sub); }

  .done { text-align: center; padding: 16px 0 6px; color: var(--ok); font-weight: 700; font-size: 17px; }
  .soon-msg { text-align: center; color: var(--sub); padding: 26px 0; font-size: 14px; }

  .btns { margin-top: 18px; }
  .copy {
    width: 100%;
    font-size: 15px;
    font-weight: 700;
    padding: 13px 12px;
    border-radius: 13px;
    border: 0;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    color: var(--accent-ink);
    cursor: pointer;
    transition: transform .1s, filter .2s;
  }
  .copy:active { transform: scale(.98); filter: brightness(.95); }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) {
    .result { animation: none; }
    .fill { transition: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="emblem" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 11.5 12 4l9 7.5"/>
        <path d="M5.5 10v9.5h13V10"/>
        <path d="M10 19.5v-5h4v5"/>
      </svg>
    </div>
    <div>
      <h1>成就計算</h1>
      <p class="lead">曜日を選んで、入力するだけ</p>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="曜日"></nav>
  <div id="panels"></div>
</main>

<script>
(function () {
  /* ============================================================
     曜日ごとの設定。曜日を足すときは、ここに書き足すだけ。
       tab         : タブに出す短い名前（省略すると name）
       target      : 目標ポイント
       items       : 入力欄（label=表示名 / pt=1個あたり / unit=単位 / copyLabel=コピー文の名前
                     / group=見出し名 / em=pt表示の差し替え / note=注意書き / raw=換算前のpt）
       groups      : 見出しごとの合計を出したいとき（name=items の group と同じ名前 / label=合計の名前 / rawLabel=換算前の合計の名前 / rawNote=換算のひとこと）
       boostPerMin : あるとき、不足分をブースト(1分あたりpt)で補う時間も出す
       doneText    : 目標に届いたときの表示
       ※ 未設定の曜日は「準備中」になります
     ============================================================ */
  var DAYS = [
    { key: "mon", label: "月", name: "英雄", target: 36000000,
      items: [
        { label: "★4 英雄の欠片", pt: 8000,  unit: "個" },
        { label: "★5 英雄の欠片", pt: 20000, unit: "個" },
        { label: "★6 英雄の欠片", pt: 30000, unit: "個" }
      ] },
    { key: "tue", label: "火", name: "避難所強化", tab: "避難所", target: 18000000,
      items: [ { label: "ガチャ回数", copyLabel: "ガチャ", pt: 20000, unit: "回" } ],
      boostPerMin: 15,
      doneText: "ガチャだけで達成できます 🎉" },
    { key: "wed", label: "水", name: "装備強化", tab: "装備", target: 94500000,
      items: [
        { label: "選択型プロモート補給箱（エリート）", pt: 10000, unit: "箱" },
        { label: "選択型プロモート補給箱（エピック）", pt: 40000, unit: "箱", note: "※プロモーターⅢを選んだときだけ40,000pt" },
        { label: "選択型プロモート補給箱",             pt: 10000, unit: "箱" },
        { label: "選択型強化補給箱",                   pt: 10000, unit: "箱" },
        { label: "選択型改造補給箱",                   pt: 30000, unit: "箱" },
        { label: "ハッピーガチャ",                     pt: 20000, unit: "回" }
      ] },
    { key: "thu", label: "木", name: "ミュータント＆モジュール", tab: "ミュ＆モ", target: 94500000,
      groups: [
        { name: "異常生物", label: "異常生物pt" },
        { name: "箱", label: "箱の合計" },
        { name: "ミュータントPt", label: "ミュータントのイベントpt", rawLabel: "ミュータントPt合計", rawNote: "100ptにつき20pt" }
      ],
      items: [
        { group: "異常生物", label: "異常生物pt", copyLabel: "異常生物pt ", pt: 1, unit: "pt", em: "入力したptをそのまま加算" },
        { group: "箱", label: "選択型プロモート補給箱（エリート）", pt: 10000, unit: "箱" },
        { group: "箱", label: "選択型プロモート補給箱（エピック）", pt: 40000, unit: "箱", note: "※プロモーターⅢを選んだときだけ40,000pt" },
        { group: "箱", label: "選択型プロモート補給箱",             pt: 10000, unit: "箱" },
        { group: "箱", label: "選択型強化補給箱",                   pt: 10000, unit: "箱" },
        { group: "箱", label: "選択型改造補給箱",                   pt: 30000, unit: "箱" },
        // ミュータントPt：100ptにつき20ポイントに換算（500→100 / 2,000→400 / 10,000→2,000）
        { group: "ミュータントPt", label: "ミュータント内政Pt 500",    raw: 500,   pt: 100,  unit: "個", em: "100pt / 個" },
        { group: "ミュータントPt", label: "ミュータント内政Pt 2,000",  raw: 2000,  pt: 400,  unit: "個", em: "400pt / 個" },
        { group: "ミュータントPt", label: "ミュータント内政Pt 10,000", raw: 10000, pt: 2000, unit: "個", em: "2,000pt / 個" },
        { group: "ミュータントPt", label: "ミュータント軍事Pt 500",    raw: 500,   pt: 100,  unit: "個", em: "100pt / 個" },
        { group: "ミュータントPt", label: "ミュータント軍事Pt 2,000",  raw: 2000,  pt: 400,  unit: "個", em: "400pt / 個" },
        { group: "ミュータントPt", label: "ミュータント軍事Pt 10,000", raw: 10000, pt: 2000, unit: "個", em: "2,000pt / 個" }
      ] },
    { key: "fri", label: "金", name: "栄誉＆器官強化", tab: "栄誉", target: 30000000,
      groups: [
        { name: "器官強化",       label: "器官強化の合計" },
        { name: "グローリー",     label: "グローリーの合計" },
        { name: "メカモジュール", label: "メカモジュールの合計" }
      ],
      items: [
        { group: "器官強化", label: "器官強化ガチャpt", copyLabel: "器官強化ガチャpt ", pt: 1, unit: "pt", em: "入力したptをそのまま加算" },
        { group: "器官強化", label: "HN器官強化ルーン選択箱",           pt: 100000,  unit: "箱" },
        { group: "器官強化", label: "R器官強化ルーン選択箱",            pt: 400000,  unit: "箱" },
        { group: "器官強化", label: "HR器官強化ルーンの破片選択箱",     pt: 10000,   unit: "箱" },
        { group: "器官強化", label: "HR器官強化ルーン選択箱",           pt: 1000000, unit: "箱" },
        { group: "器官強化", label: "SR器官強化ルーン選択箱",           pt: 2000000, unit: "箱" },
        { group: "グローリー", label: "グローリー", pt: 600, unit: "個" },
        { group: "メカモジュール", label: "Lv.1メカモジュール補給箱", pt: 5000,   unit: "箱" },
        { group: "メカモジュール", label: "Lv.2メカモジュール補給箱", pt: 15000,  unit: "箱" },
        { group: "メカモジュール", label: "Lv.3メカモジュール補給箱", pt: 45000,  unit: "箱" },
        { group: "メカモジュール", label: "Lv.4メカモジュール補給箱", pt: 135000, unit: "箱" }
      ] },
    { key: "sun", label: "日", name: "チップ＆キューブ", tab: "チップ", target: 94500000,
      items: [
        { label: "選択型プロモート補給箱（エリート）", pt: 10000, unit: "箱" },
        { label: "選択型プロモート補給箱（エピック）", pt: 40000, unit: "箱", note: "※プロモーターⅢを選んだときだけ40,000pt" },
        { label: "選択型プロモート補給箱",             pt: 10000, unit: "箱" },
        { label: "選択型強化補給箱",                   pt: 10000, unit: "箱" },
        { label: "選択型改造補給箱",                   pt: 30000, unit: "箱" }
      ] }
  ];

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var fmt = function (n) { return Math.round(n).toLocaleString("ja-JP"); };
  var tabsEl = $("#tabs"), panelsEl = $("#panels");
  var views = {};
  tabsEl.style.gridTemplateColumns = "repeat(" + DAYS.length + ", 1fr)";   // 曜日の数に合わせて等分

  function ready(d) { return !!d.items; }

  function buildPanel(d) {
    var el = document.createElement("section");
    el.hidden = true;

    if (!ready(d)) {
      el.innerHTML = '<div class="card"><div class="soon-msg">' + d.label + '曜日は準備中です</div></div>';
      panelsEl.appendChild(el);
      return { el: el };
    }

    var prevGroup = null;
    var fieldsHtml = d.items.map(function (it, i) {
      var head = "";
      if (it.group && it.group !== prevGroup) head = '<div class="group">' + it.group + '</div>';
      prevGroup = it.group || null;
      return head + '<div><label for="' + d.key + '-' + i + '">' + it.label +
        '<em>' + (it.em || fmt(it.pt) + 'pt / ' + it.unit) + '</em>' +
        (it.note ? '<span class="note">' + it.note + '</span>' : '') + '</label>' +
        '<div class="field"><input id="' + d.key + '-' + i + '" type="number" inputmode="numeric" min="0" step="1" placeholder="0" autocomplete="off">' +
        '<span class="unit">' + it.unit + '</span></div></div>';
    }).join("");

    var boostHtml = d.boostPerMin
      ? '<div class="rows"><div class="row"><span class="k">不足分</span><span class="v" data-r="short"></span></div></div>' +
        '<div class="boost-title">ブーストで補う時間</div>' +
        '<div class="tiles">' +
        '<div class="tile"><b data-r="d">0</b><span>日</span></div>' +
        '<div class="tile"><b data-r="h">0</b><span>時間</span></div>' +
        '<div class="tile"><b data-r="m">0</b><span>分</span></div></div>'
      : '<div class="remain"><span>残り</span><b data-r="remain"></b></div>';

    el.innerHTML =
      '<div class="day-title"><b>' + d.name + '</b><span>目標 ' + fmt(d.target) + ' pt</span></div>' +
      '<div class="card"><div class="fields">' + fieldsHtml + '</div></div>' +
      '<div class="card result" data-r="card" hidden>' +
        '<div class="meter-head"><span class="k">ここまでの達成度</span><span class="pct" data-r="pct">0%</span></div>' +
        '<div class="track"><div class="fill" data-r="fill"></div></div>' +
        '<div class="meter-foot"><span data-r="have"></span><span>目標 ' + fmt(d.target) + ' pt</span></div>' +
        (d.groups ? '<div class="rows sub" data-r="sub"></div>' : '') +
        '<div data-r="short-block">' + boostHtml + '</div>' +
        '<div class="done" data-r="done" hidden>' + (d.doneText || "目標達成です 🎉") + '</div>' +
        '<div class="btns"><button class="copy" type="button" data-r="copy">結果をコピー</button></div>' +
      '</div>';
    panelsEl.appendChild(el);

    var r = function (n) { return $('[data-r="' + n + '"]', el); };
    var inputs = d.items.map(function (_, i) { return $("#" + d.key + "-" + i, el); });
    var lastText = "";

    // コピー用の1行。ptをそのまま入れる欄(1pt=1pt)は「→」を付けない
    function itemLine(it, n) {
      var name = "・" + (it.copyLabel || it.label + " ");
      return it.pt === 1 ? name + fmt(n) + "pt" : name + fmt(n) + it.unit + "→" + fmt(n * it.pt) + "pt";
    }

    function calc() {
      var any = inputs.some(function (inp) { return inp.value !== ""; });
      if (!any) { r("card").hidden = true; return; }

      var total = 0, lines = [], sub = {};
      d.items.forEach(function (it, i) {
        var v = inputs[i].value;
        var n = v === "" ? 0 : Math.max(0, Math.floor(Number(v)));
        total += n * it.pt;
        if (it.group) {
          var g = sub[it.group] || (sub[it.group] = { pt: 0, raw: 0, lines: [] });
          g.pt += n * it.pt;
          g.raw += n * (it.raw || 0);
          if (v !== "") g.lines.push(itemLine(it, n));
        } else if (v !== "") {
          lines.push(itemLine(it, n));
        }
      });
      // グループ(箱 / ミュータントPt など)がある曜日は、内訳をまとめる
      if (d.groups) {
        var rowsHtml = "";
        d.groups.forEach(function (gd) {
          var g = sub[gd.name] || { pt: 0, raw: 0, lines: [] };
          var calc = gd.rawLabel
            ? '<div class="calc">計算用：' + gd.rawLabel + ' ' + fmt(g.raw) + ' pt' + (gd.rawNote ? '（' + gd.rawNote + '）' : '') + '</div>'
            : '';
          rowsHtml += '<div class="rowset"><div class="row"><span class="k">' + gd.label + '</span><span class="v">' + fmt(g.pt) + ' pt</span></div>' + calc + '</div>';
          lines.push("【" + gd.name + "】");
          Array.prototype.push.apply(lines, g.lines);
          lines.push(gd.label + " " + fmt(g.pt) + "pt" +
            (gd.rawLabel ? "（" + gd.rawLabel + " " + fmt(g.raw) + "pt" + (gd.rawNote ? "、" + gd.rawNote : "") + "）" : ""));
          lines.push("");
        });
        r("sub").innerHTML = rowsHtml;
        if (lines[lines.length - 1] === "") lines.pop();
      }
      var shortage = d.target - total;
      var pct = Math.min(100, total / d.target * 100);

      var wasHidden = r("card").hidden;
      r("card").hidden = false;
      if (wasHidden) r("fill").style.width = "0";
      requestAnimationFrame(function () { r("fill").style.width = pct + "%"; });

      r("pct").textContent = (pct >= 100 ? "100" : pct.toFixed(1)) + "%";
      r("have").textContent = fmt(total) + " pt";

      var head = d.name + "の成就  " + fmt(d.target) + "pt\n\n" + lines.join("\n") + "\n\n";

      if (shortage <= 0) {
        r("short-block").hidden = true;
        r("done").hidden = false;
        lastText = head + (d.doneText || "目標達成です").replace(/\s*🎉/, "");
        return;
      }
      r("short-block").hidden = false;
      r("done").hidden = true;

      if (d.boostPerMin) {
        var totalMin = Math.ceil(shortage / d.boostPerMin);
        var dd = Math.floor(totalMin / 1440), hh = Math.floor((totalMin % 1440) / 60), mm = totalMin % 60;
        r("short").textContent = fmt(shortage) + " pt";
        r("d").textContent = fmt(dd); r("h").textContent = hh; r("m").textContent = mm;
        lastText = head + "※不足分 " + fmt(shortage) + "pt\n\n・ブーストで補う時間\n" + dd + "日 " + hh + "時間 " + mm + "分";
      } else {
        r("remain").textContent = fmt(shortage) + " pt";
        lastText = head + "※残り " + fmt(shortage) + "pt";
      }
    }

    inputs.forEach(function (inp) { inp.addEventListener("input", calc); });

    var btn = r("copy");
    btn.addEventListener("click", function () {
      function done(msg) {
        btn.textContent = msg;
        setTimeout(function () { btn.textContent = "結果をコピー"; }, 1500);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(lastText).then(function () { done("コピーしました"); },
          function () { done("コピーできませんでした"); });
      } else {
        var ta = document.createElement("textarea");
        ta.value = lastText;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); done("コピーしました"); } catch (e) { done("コピーできませんでした"); }
        document.body.removeChild(ta);
      }
    });

    return { el: el };
  }

  function show(key) {
    DAYS.forEach(function (d) {
      var on = d.key === key;
      views[d.key].el.hidden = !on;
      views[d.key].tab.classList.toggle("active", on);
      views[d.key].tab.setAttribute("aria-selected", on ? "true" : "false");
    });
  }

  DAYS.forEach(function (d) {
    var tab = document.createElement("button");
    tab.type = "button";
    tab.className = "tab" + (ready(d) ? "" : " soon");
    tab.innerHTML = d.label + "<small>" + (ready(d) ? (d.tab || d.name) : "準備中") + "</small>";
    tab.addEventListener("click", function () { show(d.key); });
    tabsEl.appendChild(tab);
    var v = buildPanel(d);
    v.tab = tab;
    views[d.key] = v;
  });

  // 今日の曜日が準備できていればそれを、なければ最初の準備済みの曜日を開く
  var keys = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
  var today = keys[new Date().getDay()];
  var first = DAYS.filter(ready)[0].key;
  show(views[today] && DAYS.filter(function (d) { return d.key === today; })[0].items ? today : first);
})();
</script>
</body>
</html>
